name: Build Jarvis Poster

on:
  workflow_dispatch:
  push:
    paths:
      - 'jarvis-poster/**'
      - '.github/workflows/jarvis-poster-build.yml'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            artifact: Jarvis-Poster-Windows
            files: jarvis-poster/dist/*.exe
          - os: macos-latest
            target: --mac
            artifact: Jarvis-Poster-Mac
            files: jarvis-poster/dist/*.dmg
          - os: ubuntu-latest
            target: --linux
            artifact: Jarvis-Poster-Linux
            files: jarvis-poster/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: jarvis-poster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npx electron-builder ${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./jarvis-poster/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - run: |
          cd installers
          for f in *; do mv "$f" "$(echo "$f" | tr ' ' '-')"; done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: jarvis-poster-v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Jarvis Poster ${{ steps.v.outputs.version }}
          make_latest: true
          body: |
            Download the file for your computer:
            - **Windows:** `Jarvis-Poster-Setup-${{ steps.v.outputs.version }}.exe`
            - **Mac:** `-arm64.dmg` for M1/M2/M3/M4 Macs, the other `.dmg` for older Intel Macs
            - **Linux:** `.AppImage`
          files: installers/*
